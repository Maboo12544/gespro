name: Verify accounts and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Account tests, TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Select standalone build profile
        run: node --input-type=module -e "import fs from 'node:fs'; fs.mkdirSync('.sites-runtime', {recursive:true}); fs.writeFileSync('.sites-runtime/execution-profile.json', JSON.stringify({executionProfile:'portable'}));"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Account and authentication regression tests
        run: node --test tests/account-forms.test.cjs tests/access-context.test.cjs tests/access-edge.test.cjs tests/access-route.test.cjs tests/password-route.test.cjs
      - name: Check application types
        run: pnpm exec tsc --noEmit --incremental false
      - name: Build application
        run: pnpm run build
